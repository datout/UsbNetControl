name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            suffix: x64
          - arch: arm64
            suffix: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Format check
        run: test -z "$(gofmt -l *.go)"

      - name: Build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath \
            -ldflags="-H=windowsgui -s -w -X main.appVersion=ci" \
            -o "UsbNetControl-ci-win-${{ matrix.suffix }}.exe" .
